name: Android CI & Quality Gates

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Verify Test Suite & Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Create Dummy local.properties for CI
      run: |
        echo "MAPS_API_KEY=AIzaSy_CI_DUMMY_KEY_FOR_TESTS" > local.properties

    - name: Run Android Lint Check
      run: ./gradlew lintDebug --stacktrace

    - name: Run Hermetic Unit Test Suite
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Generate Cryptographic SHA-256 Digest
      run: |
        sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
        echo "Generated SHA-256 Checksum:"
        cat app/build/outputs/apk/debug/app-debug.apk.sha256

    - name: Upload Debug APK & Checksum Artifact
      uses: actions/upload-artifact@v4
      with:
        name: relief-distribution-debug-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/app-debug.apk.sha256

    - name: Upload Test & Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-and-lint-reports
        path: |
          app/build/reports/tests/testDebugUnitTest/
          app/build/reports/lint-results-debug.html
